<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Список студентов</title>
    <link rel="icon" type="image/jpeg" href="../assets/img/favicon.jpg" />
    <link rel="stylesheet" href="../assets/css/main.css" />
  </head>
  <body>
    <h1>Список студентов</h1>

    <p class="status" id="status" role="status" hidden></p>

    <p>
      <a href="../form/index.html">Добавить студента</a>
    </p>

    <p class="field">
      <label for="search">Поиск</label>
      <input
        type="search"
        id="search"
        placeholder="ФИО, группа, ИСУ id или комната"
      />
    </p>

    <p id="counter"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ФИО</th>
            <th>Группа</th>
            <th>ИСУ id</th>
            <th>Общежитие</th>
            <th>Комната</th>
            <th>Срок заселения</th>
            <th>Иностранец</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <p id="empty" hidden>Записей нет.</p>

    <script src="../assets/js/cookies.js"></script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/format.js"></script>
    <script src="../assets/js/table.js"></script>
  </body>
</html>
